<!DOCTYPE html>
<html>
<head>
    <title>Online Shop</title>

    <style>
        .card {
            width: 300px;
            height: 300px;
            background-color: #e6d5f7;
            text-align: center;
            margin: 50px auto;
            padding: 20px;
            border: 5px solid;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Online Shop</h1>

        <script>

            const item = {
                Rice: 500,
                Tea: 700,
                Coffee: 800,
                Sugar: 1000
            };

            for (let x in item) {
                document.write(x + " : " + item[x] + "<br>");
            }

            function buy() {

                let a = prompt("Enter the product name = ");
                document.write(a);
                let b = prompt("Enter the quantity = ");
                document.write(b);
                let total = item[a] * b;

                document.write("<br>Your total amount is = " + total);
            }

        </script>

        <button onclick="buy()">Buy Now</button>

    </div>

</body>
</html>
